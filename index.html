<meta charset="utf-8">

<title>チャッピーキャノン</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
:root{
  --navy:#1b2550;
  --orange:#ff5a1f;
  --gold:#ffc83a;
  --red:#e5383b;
  --pop:"Mochiy Pop One","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#7fc8f5;
  color:var(--navy);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  overflow-x:hidden;
}
.stage{
  position:relative;min-height:100%;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 16px 40px;gap:20px;
  background:url(top2.png) center/cover no-repeat;
}
.stage::before{ /* soften the art so the message stays readable */
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.15),rgba(20,30,70,.45));
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.stage>*{position:relative}

.banner{
  width:min(760px,100%);
  border-radius:20px;border:5px solid #fff;
  box-shadow:0 10px 0 rgba(27,37,80,.35),0 20px 40px rgba(0,0,0,.25);
  animation:float 3.2s ease-in-out infinite;
}

.sign{
  position:relative;
  width:min(760px,100%);
  padding:26px 18px 30px;
  background:var(--gold);
  border:6px solid var(--navy);
  border-radius:28px;
  box-shadow:0 10px 0 var(--navy),0 24px 40px rgba(0,0,0,.3);
  text-align:center;
  transform:rotate(-2deg);
  animation:wobble 2.4s ease-in-out infinite;
  background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.18) 0 18px,transparent 18px 36px);
}
.stop{
  position:absolute;top:-34px;right:-10px;
  width:84px;height:84px;display:grid;place-items:center;
  background:var(--red);color:#fff;
  font-family:var(--pop);font-size:20px;letter-spacing:.02em;
  clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);
  filter:drop-shadow(0 4px 0 var(--navy));
  animation:spin 4s ease-in-out infinite;
}
.msg{
  margin:0;
  font-family:var(--pop);font-weight:400;
  font-size:clamp(30px,8.2vw,72px);line-height:1.25;
  color:#fff;
  -webkit-text-stroke:3px var(--navy);paint-order:stroke fill;
  text-shadow:0 5px 0 var(--navy);
}
.msg .row{display:block;white-space:nowrap}
.msg span.ch{display:inline-block;animation:hop 1.4s ease-in-out infinite}
.msg .hot{color:var(--orange)}
.sub{
  margin:14px 0 0;
  font-weight:900;font-size:clamp(15px,3.6vw,22px);
}
.sub b{color:var(--red)}

.alarm{
  font-family:var(--pop);
  font-size:clamp(14px,3.4vw,18px);
  color:#fff;background:var(--navy);
  padding:10px 18px;border-radius:999px;
  box-shadow:0 5px 0 rgba(0,0,0,.3);
  text-align:center;
}
.alarm .clock{display:inline-block;animation:ring .5s ease-in-out infinite}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wobble{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.03)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-14px) rotate(-6deg)}}
@keyframes spin{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg) scale(1.1)}}
@keyframes ring{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}

@media (max-width:520px){
  .sign{padding:22px 10px 24px;border-width:5px}
  .msg{-webkit-text-stroke:2px var(--navy);text-shadow:0 3px 0 var(--navy)}
  .stop{width:64px;height:64px;font-size:15px;top:-26px;right:-4px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
}
</style>
<meta name="description" content="チャッピーキャノン。りんご砲でニセチャッピーのタワーをくずす3D物理ゲーム。タップで発射、長押しで連射。草原から宇宙まで6つのワールドとタイムアタック。Open EduTech Lab 無料公開。">
<meta property="og:title" content="チャッピーキャノン">
<meta property="og:description" content="チャッピーキャノン。りんご砲でニセチャッピーのタワーをくずす3D物理ゲーム。タップで発射、長押しで連射。草原から宇宙まで6つのワールドとタイムアタック。Open EduTech Lab 無料公開。">
<meta property="og:type" content="website">
<meta property="og:locale" content="ja_JP">
</head>
<body>
<main class="stage">
  <img class="banner" src="top2.png" alt="チャッピーキャノン">

  <section class="sign" aria-label="おしらせ">
    <div class="stop" aria-hidden="true">ストップ</div>
    <h1 class="msg">
      <span class="row" data-hop>ゲームの<span class="hot">しすぎ</span>は</span>
      <span class="row" data-hop>だめだよ～！</span>
    </h1>
    <p class="sub">チャッピーも<b>ひとやすみ</b>中だよ。また こんど あそぼうね！</p>
  </section>

  <p class="alarm"><span class="clock" aria-hidden="true">⏰</span> 目をやすめて、のびーっとしよう</p>
</main>

<script>
// split each row into letters so they hop one after another
document.querySelectorAll('[data-hop]').forEach((row, r) => {
  let i = r * 6;
  const wrap = node => {
    [...node.childNodes].forEach(n => {
      if (n.nodeType === 3) {
        const frag = document.createDocumentFragment();
        for (const c of n.textContent) {
          const s = document.createElement('span');
          s.className = 'ch';
          s.textContent = c;
          s.style.animationDelay = (i++ * 0.08) + 's';
          frag.appendChild(s);
        }
        n.replaceWith(frag);
      } else wrap(n);
    });
  };
  wrap(row);
});
</script>
</body>
</html>
